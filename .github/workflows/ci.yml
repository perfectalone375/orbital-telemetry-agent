name: CI Build & Test Matrix

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    name: Test Suite (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[dev]

      - name: Lint check
        run: |
          ruff check src/ tests/

      - name: Run Pytest
        run: |
          pytest --cov=orbital_telemetry tests/

  docker-build:
    name: Docker Container Build & Smoke Test
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build runtime Docker image
        run: |
          docker build --target runtime -t orbital-telemetry:latest .

      - name: Smoke test container entrypoint
        run: |
          docker run --rm orbital-telemetry:latest --help

      - name: Build and execute container test stage
        run: |
          docker build --target test -t orbital-telemetry:test .
          docker run --rm orbital-telemetry:test
